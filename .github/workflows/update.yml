name: Update from Notion

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 로컬 개발 환경과 동일 버전으로 고정 — 빌드 산출물 바이트가 달라져
        # 커밋이 반복 생성되는 것을 방지
        run: pip install fonttools==4.60.2 pillow==11.3.0

      - name: Build from Notion
        run: python build/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 업데이트: 노션 변경 반영"
            git push
          fi
